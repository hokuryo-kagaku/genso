<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>元素記号タッチ</title>
<style>
  :root{
    --bg1:#0d1424; --bg2:#1b2a4a; --text:#ffffff; --sub:#8fa0c0;
    --tile1:#3dd6f5; --tile2:#2a8cf0; --tileShadow:#1a5fb0;
    --ok:#3ee08a; --ng:#ff4d5e; --accent:#ffc83d; --accentShadow:#c9921a;
    --panel:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%) fixed, var(--bg1);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
  .app{max-width:440px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);}
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.on{display:flex;}
  .num{font-family:"SF Mono","Menlo","Consolas",monospace; font-variant-numeric:tabular-nums;}

  /* ===== タイトル ===== */
  .menu-link{align-self:flex-start; color:var(--sub); font-size:14px; text-decoration:none; padding:6px 2px;}
  .title-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center;}
  .logo{display:grid; grid-template-columns:repeat(3,52px); gap:6px;}
  .logo span{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center;
             font-weight:800; font-size:22px; background:linear-gradient(160deg,var(--tile1),var(--tile2));
             box-shadow:0 4px 0 var(--tileShadow); font-family:"Helvetica Neue",Arial,sans-serif;}
  .logo span.off{background:rgba(255,255,255,.08); box-shadow:none; color:transparent;}
  h1{margin:0; font-size:34px; letter-spacing:.12em; font-weight:800;}
  .catch{margin:-14px 0 0; color:var(--sub); font-size:14px; letter-spacing:.2em;}
  .rule{background:var(--panel); border-radius:16px; padding:14px 18px; font-size:15px; line-height:1.8;}
  .rule b{color:var(--tile1);}
  .rule .ng{color:var(--ng);}
  .best-lbl{color:var(--sub); font-size:13px; letter-spacing:.25em;}
  .best-val{font-size:34px; font-weight:700; margin-top:2px;}
  .modes{display:flex; flex-direction:column; gap:14px; width:100%;}
  .mode{display:flex; align-items:center; gap:14px; width:100%; border:none; border-radius:18px; cursor:pointer;
        padding:14px 16px; text-align:left; color:#3a2600;
        background:linear-gradient(160deg,#ffe08a,var(--accent)); box-shadow:0 6px 0 var(--accentShadow);}
  .mode:active{transform:translateY(5px); box-shadow:0 1px 0 var(--accentShadow);}
  .mode.blue{color:#fff; background:linear-gradient(160deg,var(--tile1),var(--tile2)); box-shadow:0 6px 0 var(--tileShadow);}
  .mode.blue:active{box-shadow:0 1px 0 var(--tileShadow);}
  .mode .ic{flex:0 0 54px; height:54px; border-radius:12px; background:rgba(255,255,255,.35); display:flex; align-items:center;
            justify-content:center; font-size:20px; font-weight:800; font-family:"Helvetica Neue",Arial,sans-serif;}
  .mode .tx{flex:1; min-width:0;}
  .mode .nm{display:block; font-size:21px; font-weight:800;}
  .mode .ds{display:block; font-size:13px; opacity:.85; margin-top:2px;}
  .mode .bs{flex:0 0 auto; text-align:right; font-size:11px; letter-spacing:.15em; opacity:.85;}
  .mode .bs b{display:block; font-size:18px; letter-spacing:0;}

  /* ===== ゲーム ===== */
  .topbar{display:flex; align-items:center; justify-content:space-between; height:40px;}
  .quit{border:none; background:var(--panel); color:var(--sub); border-radius:20px; padding:8px 14px;
        font-size:14px; font-weight:700; cursor:pointer;}
  .quit:active{background:rgba(255,255,255,.15);}
  .miss-chip{font-size:14px; color:var(--sub);}
  .miss-chip b{color:var(--text); font-size:18px;}
  .timer{text-align:center; font-size:64px; font-weight:700; line-height:1.1; margin:6px 0 2px; letter-spacing:.02em;}
  .timer small{font-size:24px; color:var(--sub); margin-left:4px;}
  .next{text-align:center; margin-bottom:12px; height:26px;}
  .next > span{display:inline-block; background:var(--panel); border-radius:14px; padding:3px 16px; font-size:15px; color:var(--sub);}
  .next b{color:var(--accent); font-size:19px; margin-left:4px;}
  .pen{position:fixed; left:50%; top:30%; transform:translateX(-50%); color:var(--ng); font-size:34px; font-weight:800;
       pointer-events:none; opacity:0; text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .pen.show{animation:penUp .7s ease-out;}
  @keyframes penUp{0%{opacity:1; transform:translate(-50%,10px);}100%{opacity:0; transform:translate(-50%,-30px);}}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:auto 0;}
  .cell{aspect-ratio:1; border:none; border-radius:14px; padding:0; cursor:pointer; position:relative;
        background:linear-gradient(160deg,var(--tile1),var(--tile2)); color:#fff;
        box-shadow:0 5px 0 var(--tileShadow);
        font-size:clamp(28px, 9vw, 38px); font-weight:800; font-family:"Helvetica Neue",Arial,sans-serif;
        text-shadow:0 2px 0 rgba(0,0,0,.18); transition:transform .08s;}
  .cell:active{transform:translateY(3px); box-shadow:0 2px 0 var(--tileShadow);}
  .grid.hidden .cell{color:transparent; text-shadow:none;
        background:repeating-linear-gradient(45deg,#2a8cf0 0 8px,#2479d6 8px 16px);}
  .cell.done{background:rgba(255,255,255,.05); box-shadow:none; color:rgba(255,255,255,.18); text-shadow:none;
             transform:scale(.9); transition:transform .15s, background .15s; pointer-events:none;}
  .cell.miss{background:linear-gradient(160deg,#ff7a85,var(--ng)); box-shadow:0 5px 0 #a8202e; animation:shake .35s;}
  @keyframes shake{0%,100%{translate:0;}20%{translate:-7px;}40%{translate:7px;}60%{translate:-5px;}80%{translate:5px;}}
  .bar{height:6px; background:var(--panel); border-radius:3px; overflow:hidden; margin-top:14px;}
  .bar div{height:100%; width:0; background:linear-gradient(90deg,var(--tile1),var(--ok)); transition:width .15s;}

  /* カウントダウン */
  .count{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10;
         background:rgba(13,20,36,.75); font-size:140px; font-weight:800; color:var(--accent);}
  .count.on{display:flex;}
  .count span{animation:zoom .7s ease-out;}
  @keyframes zoom{0%{transform:scale(1.8); opacity:0;}30%{opacity:1;}100%{transform:scale(1);}}

  /* やめる確認 */
  .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20;
         background:rgba(0,0,0,.6); padding:16px;}
  .modal.on{display:flex;}
  .dialog{background:#1e2c4c; border-radius:20px; padding:24px 20px 20px; width:100%; max-width:320px; text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .dialog p{margin:0 0 6px; font-size:18px; font-weight:700;}
  .dialog .note{font-size:13px; color:var(--sub); font-weight:400; margin-bottom:18px;}
  .dialog .row{display:flex; gap:10px;}
  .dialog button{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:16px; font-weight:700; cursor:pointer;}
  .yes{background:var(--ng); color:#fff;}
  .no{background:rgba(255,255,255,.12); color:#fff;}

  /* ===== 結果 ===== */
  .res-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;}
  .clear{font-size:30px; font-weight:800; letter-spacing:.2em; color:var(--ok);}
  .res-time{font-size:72px; font-weight:700; line-height:1;}
  .res-time small{font-size:26px; color:var(--sub);}
  .res-sub{color:var(--sub); font-size:15px;}
  .newbest{color:var(--accent); font-size:22px; font-weight:800; animation:pop .6s;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .answer{display:grid; grid-template-columns:repeat(4,1fr); gap:6px 4px; width:100%; background:var(--panel);
          border-radius:16px; padding:12px 8px; font-size:12px;}
  .answer span{white-space:nowrap; color:var(--sub);}
  .answer b{display:block; color:#fff; font-size:17px; font-family:"Helvetica Neue",Arial,sans-serif;}
  .btns{display:flex; gap:10px; width:100%; margin-top:4px;}
  .btn{flex:1; border:none; border-radius:14px; padding:15px 0; font-size:18px; font-weight:800; cursor:pointer;}
  .btn.main{background:var(--accent); color:#3a2600; box-shadow:0 5px 0 var(--accentShadow);}
  .btn.main:active{transform:translateY(4px); box-shadow:0 1px 0 var(--accentShadow);}
  .btn.sub{background:rgba(255,255,255,.12); color:#fff;}
</style>
</head>
<body>
<div class="app">

  <!-- タイトル -->
  <section class="screen on" id="start">
    <a class="menu-link" href="../">← メニューへ</a>
    <div class="title-wrap">
      <div class="logo" aria-hidden="true">
        <span>H</span><span>He</span><span class="off">.</span>
        <span class="off">.</span><span>Li</span><span>Be</span>
      </div>
      <h1>元素記号タッチ</h1>
      <p class="catch">ATOMIC NUMBER 1 – 20</p>
      <div class="modes">
        <button class="mode" data-mode="num">
          <span class="ic num">1→</span>
          <span class="tx"><span class="nm">原子番号モード</span><span class="ds">H → He → Li … の順にタッチ</span></span>
          <span class="bs">BEST<b class="num" id="best-num">--.--</b></span>
        </button>
        <button class="mode blue" data-mode="name">
          <span class="ic">水素</span>
          <span class="tx"><span class="nm">元素名モード</span><span class="ds">元素名を見て記号をタッチ</span></span>
          <span class="bs">BEST<b class="num" id="best-name">--.--</b></span>
        </button>
      </div>
      <div class="rule" style="font-size:14px">まちがえると <span class="ng">＋1秒</span> のペナルティ</div>
    </div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="game">
    <div class="topbar">
      <button class="quit" id="quitBtn">✕ やめる</button>
      <div class="miss-chip">ミス <b class="num" id="miss">0</b></div>
    </div>
    <div class="timer num"><span id="time">0.00</span><small>秒</small></div>
    <div class="next"><span><span id="nextLbl">次は原子番号</span><b id="next">1</b></span></div>
    <div class="grid" id="grid"></div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result">
    <div class="res-wrap">
      <div class="clear">CLEAR!</div>
      <div class="res-sub" id="rMode" style="margin-top:-8px"></div>
      <div class="res-time num"><span id="rTime"></span><small> 秒</small></div>
      <div class="res-sub" id="rDetail"></div>
      <div class="newbest" id="rNew" hidden>★ 自己ベスト更新！ ★</div>
      <div class="res-sub">BEST <b class="num" id="bestResult" style="color:#fff">--.--</b></div>
      <div class="answer" id="answer"></div>
      <div class="btns">
        <button class="btn sub" id="topBtn">タイトルへ</button>
        <button class="btn main" id="retryBtn">もう一度</button>
      </div>
    </div>
  </section>
</div>

<div class="pen" id="pen">＋1秒</div>
<div class="count" id="count"></div>
<div class="modal" id="modal">
  <div class="dialog">
    <p>ゲームをやめますか？</p>
    <div class="note">タイトルに戻ります。記録は残りません。</div>
    <div class="row">
      <button class="no" id="noBtn">つづける</button>
      <button class="yes" id="yesBtn">やめる</button>
    </div>
  </div>
</div>

<script>
const EL = [
  ["H","水素"],["He","ヘリウム"],["Li","リチウム"],["Be","ベリリウム"],["B","ホウ素"],
  ["C","炭素"],["N","窒素"],["O","酸素"],["F","フッ素"],["Ne","ネオン"],
  ["Na","ナトリウム"],["Mg","マグネシウム"],["Al","アルミニウム"],["Si","ケイ素"],["P","リン"],
  ["S","硫黄"],["Cl","塩素"],["Ar","アルゴン"],["K","カリウム"],["Ca","カルシウム"]
];
const PENALTY = 1.0; // 秒
// key は自己ベストの保存名（原子番号モードは以前の記録を引き継ぐ）
const MODES = {
  num:  {title:"原子番号モード", key:"genso-touch-best",      label:"次は原子番号"},
  name: {title:"元素名モード",   key:"genso-touch-best-name", label:"次は"}
};

const $ = id => document.getElementById(id);
let mode = "num", order, step, misses, t0, timer, countIv, playing = false;

function getBest(m){ try{ const v = parseFloat(localStorage.getItem(MODES[m].key)); return isNaN(v) ? null : v; }catch(e){ return null; } }
function setBest(m, v){ try{ localStorage.setItem(MODES[m].key, String(v)); }catch(e){} }
function fmt(s){ return s.toFixed(2); }
function showBest(el, m){ const b = getBest(m); el.textContent = b == null ? "--.--" : fmt(b); }
function showAllBest(){ for(const m in MODES) showBest($("best-" + m), m); }
function showTarget(){
  const z = order[step];
  $("next").textContent = mode === "num" ? z : EL[z - 1][1];
}
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function elapsed(){ return (performance.now() - t0) / 1000 + misses * PENALTY; }

function buildGrid(){
  const g = $("grid");
  g.innerHTML = "";
  shuffle(EL.map((e, i) => i + 1)).forEach(z => {
    const b = document.createElement("button");
    b.className = "cell";
    b.dataset.z = z;
    b.textContent = EL[z - 1][0];
    b.addEventListener("pointerdown", ev => { ev.preventDefault(); tap(b, z); });
    g.appendChild(b);
  });
}

function tap(b, z){
  if(!playing || b.classList.contains("done")) return;
  if(z === order[step]){
    b.classList.add("done");
    step++;
    $("bar").style.width = (step / 20 * 100) + "%";
    if(step >= 20){ finish(); return; }
    showTarget();
  }else{
    misses++;
    $("miss").textContent = misses;
    b.classList.remove("miss"); void b.offsetWidth; b.classList.add("miss");
    clearTimeout(b.mt); b.mt = setTimeout(() => b.classList.remove("miss"), 350);
    const p = $("pen"); p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
    if(navigator.vibrate) navigator.vibrate(80);
  }
}

function stopAll(){
  playing = false;
  clearInterval(timer); clearInterval(countIv);
  $("count").classList.remove("on");
  $("grid").classList.remove("hidden");
}

function startGame(){
  stopAll();
  const nums = EL.map((e, i) => i + 1);
  // 原子番号モードは 1→20、元素名モードは名前がランダムな順に出る
  order = mode === "num" ? nums : shuffle(nums.slice());
  step = 0; misses = 0;
  $("nextLbl").textContent = MODES[mode].label;
  // カウントダウン中：原子番号モードはタイルを伏せる／元素名モードは問題を「？」にする
  if(mode === "num"){ $("grid").classList.add("hidden"); showTarget(); }
  else{ $("next").textContent = "？"; }
  $("miss").textContent = "0"; $("time").textContent = "0.00";
  $("bar").style.width = "0";
  buildGrid();
  show("game");
  const c = $("count"); let n = 3;
  const put = () => c.innerHTML = "<span>" + n + "</span>";
  put(); c.classList.add("on");
  countIv = setInterval(() => {
    n--;
    if(n > 0){ put(); return; }
    clearInterval(countIv);
    c.classList.remove("on");
    $("grid").classList.remove("hidden");
    showTarget();
    t0 = performance.now(); playing = true;
    timer = setInterval(() => $("time").textContent = fmt(elapsed()), 30);
  }, 700);
}

function finish(){
  stopAll();
  const t = elapsed();
  $("time").textContent = fmt(t);
  const old = getBest(mode);
  const isNew = old == null || t < old;
  if(isNew) setBest(mode, t);
  $("rMode").textContent = MODES[mode].title;
  $("rTime").textContent = fmt(t);
  $("rDetail").textContent = "ミス " + misses + " 回（＋" + (misses * PENALTY).toFixed(0) + " 秒）";
  $("rNew").hidden = !isNew;
  showBest($("bestResult"), mode);
  $("answer").innerHTML = EL.map((e, i) => "<span>" + (i + 1) + "<b>" + e[0] + "</b>" + e[1] + "</span>").join("");
  setTimeout(() => show("result"), 350);
}

function toTitle(){ stopAll(); showAllBest(); show("start"); }

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; startGame(); }));
$("retryBtn").addEventListener("click", startGame);
$("topBtn").addEventListener("click", toTitle);
$("quitBtn").addEventListener("click", () => $("modal").classList.add("on"));
$("noBtn").addEventListener("click", () => $("modal").classList.remove("on"));
$("yesBtn").addEventListener("click", () => { $("modal").classList.remove("on"); toTitle(); });
showAllBest();
</script>
</body>
</html>
